<body>
<style id="je-style">
#je-trig{display:none}
#je-pin-ov,#je-ed-ov{display:none;position:fixed;inset:0;z-index:9500}
#je-pin-ov{background:#f7f4ee;font-family:'Pretendard Variable','Apple SD Gothic Neo',sans-serif;flex-direction:column;align-items:center;justify-content:center}
#je-pin-ov.je-show{display:flex}
#je-ed-ov{background:#f4f1eb;font-family:'Pretendard Variable','Apple SD Gothic Neo',sans-serif;flex-direction:column;overflow:hidden}
#je-ed-ov.je-show{display:flex}
@media (min-width:601px){
  #je-pin-ov,#je-ed-ov{inset:unset;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:82vh;max-height:740px;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.18);border:1px solid #ddd8ce}
  #je-pin-ov{width:400px;height:auto;padding:48px 32px 40px}
}
/* 핀 UI */
.je-pin-brand{text-align:center;margin-bottom:44px}
.je-pin-brand-sub{font-size:.62rem;letter-spacing:.32em;color:#9a9288;text-transform:uppercase;margin-bottom:8px}
.je-pin-brand-ttl{font-size:1.7rem;font-weight:800;color:#2d4a3e}
.je-pin-brand-bar{width:36px;height:3px;background:#2d4a3e;border-radius:2px;margin:10px auto}
.je-pin-brand-hint{font-size:.76rem;color:#9a9288}
.je-pin-dots{display:flex;gap:14px;margin-bottom:28px;justify-content:center}
.je-dot{width:13px;height:13px;border-radius:50%;border:2px solid #d4cfc6;background:transparent;transition:all .15s}
.je-dot.on{background:#2d4a3e;border-color:#2d4a3e}
.je-numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.je-nk{width:68px;height:68px;border-radius:18px;border:1.5px solid #e4ddd0;background:#fff;color:#1a1815;font-size:1.4rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background .1s,transform .08s;box-shadow:0 1px 4px rgba(0,0,0,.06);-webkit-tap-highlight-color:transparent}
.je-nk:active{transform:scale(.92);background:#e8f2ee}
.je-nk.je-nk-c{border-color:#f0cece;background:#fff8f8;color:#b83232}
/* 애니메이션 */
@keyframes je-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes je-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes je-toast{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.je-shake{animation:je-shake .5s ease}
/* 에디터 헤더 */
.je-hdr{display:flex;align-items:center;gap:8px;padding:0 16px;height:52px;background:#fff;border-bottom:1px solid #ece8e0;flex-shrink:0;}
.je-hdr-mid{flex:1;text-align:center}
.je-hdr-ref{font-size:.9rem;font-weight:800;color:#1a1815}
.je-hdr-cnt{font-size:.65rem;color:#a8a29a;margin-top:1px}
.je-btn-back{background:none;border:none;color:#2d4a3e;font-size:.85rem;font-weight:700;cursor:pointer;padding:8px 2px;font-family:inherit;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.je-btn-back:active{opacity:.6}
.je-btn-save{border:none;border-radius:8px;padding:7px 16px;font-weight:700;font-size:.82rem;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent;min-width:52px}
.je-btn-save.active{background:#2d4a3e;color:#fff}
.je-btn-save.idle{background:#ece8e0;color:#a8a29a}
.je-btn-save:active{opacity:.75;transform:scale(.95)}
/* 에디터 본문 */
#je-ta{display:none}
#je-ce{flex:1;padding:16px;border:none;outline:none;font-size:1rem;line-height:1.85;color:#1a1815;background:#fff;font-family:'Pretendard Variable','Apple SD Gothic Neo',sans-serif;-webkit-overflow-scrolling:touch;overflow-y:auto;box-sizing:border-box;white-space:pre-wrap;word-break:break-all;}
#je-ce::-webkit-scrollbar{width:4px;}
#je-ce::-webkit-scrollbar-track{background:transparent;}
#je-ce::-webkit-scrollbar-thumb{background:#d4cec6;border-radius:2px;}
#je-ce::-webkit-scrollbar-thumb:hover{background:#b0a89e;}
#je-ce[contenteditable="false"]{cursor:default;background:#fdfcf9;caret-color:transparent;}
#je-edit-btn{border:none;border-radius:8px;padding:7px 14px;font-weight:700;font-size:.82rem;cursor:pointer;font-family:inherit;background:#2d4a3e;color:#fff;-webkit-tap-highlight-color:transparent;transition:opacity .15s;}
#je-edit-btn:active{opacity:.75;transform:scale(.95);}
#je-ce:empty::before{content:attr(data-placeholder);color:#c0bdb6;pointer-events:none;}
#je-ce b{font-weight:700;}
#je-ce i{font-style:italic;}
#je-ce u{text-decoration:underline;}
#je-ce s{text-decoration:line-through;}
#je-ce .je-j{color:#d0342c;font-weight:600;}
#je-verse-panel{background:#f3efe6;border-bottom:1px solid #e8e3d8;flex-shrink:0;padding:9px 16px;display:none;}
#je-verse-panel.je-vp-show{display:block;}
#je-verse-text{font-size:0.85rem;line-height:1.7;color:#3a3730;word-break:keep-all;}
#je-verse-src{font-size:0.68rem;color:#9a9288;margin-top:3px;}
/* 메타 필드 */
#je-meta-panel{background:#fff;border-bottom:1px solid #ece8e0;flex-shrink:0;padding:0;}
#je-meta-toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;cursor:pointer;background:#faf9f6;border-bottom:1px solid #ece8e0;user-select:none;-webkit-tap-highlight-color:transparent;}
#je-meta-toggle-label{font-size:0.72rem;font-weight:700;color:#2d4a3e;letter-spacing:0.03em;}
#je-meta-toggle-arrow{font-size:0.7rem;color:#9a9288;transition:transform 0.2s;}
#je-meta-toggle.open #je-meta-toggle-arrow{transform:rotate(180deg);}
#je-meta-fields{display:none;padding:10px 14px 14px;gap:8px;flex-direction:column;}
#je-meta-fields.open{display:flex;}
.je-mf-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.je-mf-group{display:flex;flex-direction:column;gap:3px;}
.je-mf-group.full{grid-column:1/-1;}
.je-mf-label{font-size:0.63rem;font-weight:700;color:#9a9288;letter-spacing:0.05em;text-transform:uppercase;}
.je-mf-input{border:1.5px solid #e4ddd0;border-radius:8px;padding:7px 10px;font-size:0.82rem;color:#1a1815;background:#fff;font-family:inherit;outline:none;transition:border-color 0.15s;-webkit-appearance:none;}
.je-mf-input:focus{border-color:#2d4a3e;}
.je-mf-input.je-mf-mono{font-size:0.7rem;color:#7a6a8a;letter-spacing:0.02em;}
.je-mf-input[readonly]{background:#f7f4ee;color:#9a9288;cursor:default;}
.je-mf-hint{font-size:0.6rem;color:#b8b2aa;margin-top:1px;}
.je-mf-save-row{display:flex;justify-content:flex-end;margin-top:4px;}
.je-mf-save-btn{border:none;border-radius:8px;padding:7px 18px;font-weight:700;font-size:0.82rem;cursor:pointer;font-family:inherit;background:#2d4a3e;color:#fff;transition:opacity 0.15s;}
.je-mf-save-btn:active{opacity:0.75;}
/* 툴바 */
#je-toolbar{display:flex;align-items:center;gap:2px;padding:5px 10px;background:#faf9f6;border-bottom:1px solid #ece8e0;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
#je-toolbar::-webkit-scrollbar{display:none}
#je-toolbar button{border:none;background:transparent;border-radius:6px;padding:3px 7px;font-size:0.82rem;font-weight:700;color:#4a4740;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .12s;-webkit-tap-highlight-color:transparent;}
#je-toolbar button:hover{background:#ede9e0;color:#1a1815}
#je-toolbar button:active{transform:scale(.93)}
#je-toolbar .je-tb-div{width:1px;height:16px;background:#e0dbd0;flex-shrink:0;margin:0 3px;}
#je-toolbar .je-tb-i{font-style:italic}
#je-toolbar .je-tb-u{text-decoration:underline}
#je-toolbar .je-tb-s{text-decoration:line-through}
#je-toolbar .je-tb-j{color:#d0342c}
/* 크기 조절 핸들 */
#je-resize-bar,#je-resize-bar-list{display:none;height:8px;cursor:ns-resize;background:transparent;flex-shrink:0;position:relative;user-select:none;-webkit-user-select:none}
#je-resize-bar::before,#je-resize-bar-list::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:32px;height:3px;border-radius:2px;background:#d8d2c8}
#je-resize-bar:hover::before,#je-resize-bar.dragging::before,#je-resize-bar-list:hover::before,#je-resize-bar-list.dragging::before{background:#2d4a3e}
@media(min-width:601px){#je-resize-bar,#je-resize-bar-list{display:block}}
/* 목록 레이아웃 */
#je-list-ov{display:flex;flex-direction:column;height:100%;overflow:hidden}
/* 헤더 영역 */
.je-list-hdr{background:#fff;padding:14px 16px 0;flex-shrink:0;border-bottom:1px solid #ece8e0;}
.je-list-hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.je-list-ttl{font-size:1rem;font-weight:800;color:#1a1815}
.je-list-sub{font-size:.67rem;color:#a8a29a;margin-top:2px}
.je-list-btns{display:flex;gap:6px;flex-shrink:0}
/* 탭 — 세그먼트 컨트롤 */
#je-tab-bar{display:flex;gap:0;padding:12px 16px 12px;background:#fff;border-bottom:1px solid #ece8e0;flex-shrink:0;}
.je-tab-btn{flex:1;border:1.5px solid #ddd8ce;border-right:none;padding:7px 4px;font-size:0.74rem;font-weight:700;cursor:pointer;font-family:inherit;background:#faf9f6;color:#9a9288;transition:all .15s;-webkit-tap-highlight-color:transparent;white-space:nowrap;text-align:center;border-radius:0;}
.je-tab-btn:first-child{border-radius:9px 0 0 9px;}
.je-tab-btn:last-child{border-radius:0 9px 9px 0;border-right:1.5px solid #ddd8ce;}
.je-tab-btn.active{background:#2d4a3e;color:#fff;border-color:#2d4a3e;z-index:1;position:relative;}
.je-tab-btn:not(.active):hover{background:#e8f0ec;color:#2d4a3e;}
.je-tab-cnt{display:inline-block;margin-left:3px;font-size:0.66rem;opacity:0.8;}
/* 성경역본 드롭존 — 미니멀 */
#je-bible-drop{border:none;border-bottom:1px solid #ece8e0;border-radius:0;background:#faf9f6;display:flex;align-items:center;justify-content:center;cursor:default;padding:8px 16px;transition:background .15s;flex-shrink:0;}
#je-bible-drop.drag{background:#e4f0ea;}
#je-bible-drop.loaded{background:#f0f7f3;cursor:default;}
#je-bible-drop-txt{font-size:0.75rem;color:#9ab4aa;}
#je-bible-drop-txt strong{color:#3d6b5a;font-weight:700;}
#je-bible-inp{display:none;}
/* 정렬 바 */
.je-sort-bar{display:none;gap:5px;padding:7px 14px;background:#faf9f6;flex-wrap:nowrap;align-items:center;border-bottom:1px solid #ece8e0;overflow-x:auto;scrollbar-width:none;}
.je-sort-bar::-webkit-scrollbar{display:none}
.je-sort-bar.vis{display:flex}
.je-sort-divider{width:1px;height:13px;background:#ddd8ce;flex-shrink:0;margin:0 3px;align-self:center}
.je-sort-label{font-size:0.68rem;font-weight:600;color:#a8a29a;letter-spacing:.01em;flex-shrink:0}
/* 필 버튼 — 정렬/필터 통일 */
.je-sort-btn,.je-bfbtn{display:inline-flex;align-items:center;gap:3px;border:1.5px solid #ddd8ce;border-radius:100px;background:#fff;color:#5a5450;font-size:0.71rem;font-weight:700;padding:3px 11px;cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap;flex-shrink:0;line-height:1.55;-webkit-tap-highlight-color:transparent;}
.je-sort-btn:hover,.je-bfbtn:hover{border-color:#b0c8be;color:#2d4a3e;}
.je-sort-btn.on,.je-bfbtn.on{background:#2d4a3e;color:#fff;border-color:#2d4a3e;}
.je-bfbtn.ot.on{background:#7a3f12;border-color:#7a3f12;}
.je-bfbtn.nt.on{background:#1a3f7a;border-color:#1a3f7a;}
.je-bfbtn-cnt,.je-tab-cnt{font-size:0.63rem;font-weight:600;opacity:.75;}
.je-bfbtn-sep{width:1px;height:14px;background:#ddd8ce;margin:0 5px;flex-shrink:0;align-self:center}
/* 책 필터 바 */
.je-book-filter-bar{display:none;gap:0;padding:7px 14px;background:#faf9f6;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;white-space:nowrap;flex-shrink:0;border-bottom:1px solid #ece8e0;touch-action:pan-x;}
.je-book-filter-bar::-webkit-scrollbar{display:none}
.je-book-filter-bar.vis{display:flex;align-items:center;flex-wrap:nowrap;gap:5px;}
/* 검색창 */
.je-search-wrap{position:relative;padding:8px 14px 6px;background:#fff;border-bottom:1px solid #ece8e0;}
.je-search{width:100%;padding:9px 32px 9px 12px;border-radius:9px;border:1.5px solid #ddd8ce;font-size:.87rem;color:#1a1815;background:#faf9f6;font-family:inherit;outline:none;box-sizing:border-box;-webkit-appearance:none;transition:border-color .15s;}
.je-search:focus{border-color:#2d4a3e;background:#fff;}
.je-search-clr{position:absolute;right:18px;top:50%;transform:translateY(-50%);background:none;border:none;color:#b0a89e;cursor:pointer;font-size:1rem;padding:4px;line-height:1;}
#je-ctrl-bar{background:#faf9f6;flex-shrink:0;}
/* 목록 바디 */
.je-list-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 0 40px;}
.je-list-body::-webkit-scrollbar{width:4px;}
.je-list-body::-webkit-scrollbar-track{background:transparent;}
.je-list-body::-webkit-scrollbar-thumb{background:#d4cec6;border-radius:2px;}
.je-list-body::-webkit-scrollbar-thumb:hover{background:#b0a89e;}
.je-list-body{scrollbar-width:thin;scrollbar-color:#d4cec6 transparent;}
/* 삭제 버튼 */
.je-del-btn{border:none;background:none;color:#d8d2ca;font-size:.78rem;cursor:pointer;padding:3px 5px;border-radius:4px;line-height:1;flex-shrink:0;margin-left:2px;transition:color .12s;}
.je-del-btn:hover{color:#d84040;background:#fdf0f0;}
/* 카드 */
.je-card{margin:0 12px 7px;background:#fff;border-radius:12px;padding:13px 14px;cursor:pointer;border:1px solid #ece8e0;-webkit-tap-highlight-color:transparent;animation:je-rise .2s ease;}
.je-card:hover{border-color:#c8d8cc;}
.je-card:active{background:#eef5f0;}
.je-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:6px}
.je-card-book{font-size:.86rem;font-weight:800;color:#2d4a3e}
.je-card-ref{font-size:.76rem;font-weight:600;color:#5a5450;margin-left:4px}
.je-bk-bm{color:#2d6a4f!important}.je-ref-bm{color:#5a9a78!important}
.je-bk-sr{color:#222!important}.je-ref-sr{color:#666!important}
.je-bk-hl{color:#9a5800!important}.je-ref-hl{color:#c07800!important}
.je-card-len{font-size:.66rem;color:#b89a30;font-weight:500;white-space:nowrap;flex-shrink:0;}
.je-card-title{font-size:.84rem;color:#2a2720;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:3px;word-break:break-all;}
.je-card-date{font-size:.64rem;color:#a8a29a;}
/* 카드 배지 */
.je-card-badge{display:none;font-size:0.6rem;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:5px;flex-shrink:0;vertical-align:baseline;}
.je-badge-bm,.je-badge-sr,.je-badge-hl{display:none;}
/* 빈 상태 */
.je-empty{text-align:center;color:#a8a29a;padding:52px 24px;font-size:.86rem;}
/* 파일 드롭 오버레이 */
#je-drop-ov{display:flex;flex:1;align-items:center;justify-content:center;padding:24px;}
.je-drop-box{width:100%;max-width:320px;border:2px dashed #cdc8be;border-radius:18px;padding:48px 24px;text-align:center;cursor:pointer;background:#fff;transition:all .2s;}
.je-drop-box.drag{border-color:#2d4a3e;background:#eaf2ec;}
.je-drop-ttl{font-size:.95rem;font-weight:700;color:#1a1815;margin:12px 0 6px;}
.je-drop-sub{font-size:.76rem;color:#a8a29a;}
/* 헤더 버튼 */
.je-lbtn{border-radius:8px;padding:7px 14px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;border:none;-webkit-tap-highlight-color:transparent;transition:all .12s;}
.je-lbtn:active{opacity:.7;}
.je-lbtn-exp{background:#2d4a3e;color:#fff;}
.je-lbtn-file{background:#eef5f1;color:#2d4a3e;border:1.5px solid #c0d8cc;}
.je-lbtn-close{background:#f0ede6;color:#6a6560;}
.je-lbtn:hover{opacity:.85;}
/* 토스트 */

<script>
(function() {
var _PIN = '0410';
var _BN = {GEN:'창세기',EXO:'출애굽기',LEV:'레위기',NUM:'민수기',DEU:'신명기',JOS:'여호수아',JDG:'사사기',RUT:'룻기','1SA':'사무엘상','2SA':'사무엘하','1KI':'열왕기상','2KI':'열왕기하','1CH':'역대상','2CH':'역대하',EZR:'에스라',NEH:'느헤미야',EST:'에스더',JOB:'욥기',PSA:'시편',PRO:'잠언',ECC:'전도서',SNG:'아가',ISA:'이사야',JER:'예레미야',LAM:'예레미야애가',EZK:'에스겨',DAN:'다니엘',HOS:'호세아',JOL:'요엘',AMO:'아모스',OBA:'오바닸',JON:'요나',MIC:'미가',NAM:'나훘',HAB:'하박국',ZEP:'스바냐',HAG:'학개',ZEC:'스가라',MAL:'말라기',MAT:'마태복음',MRK:'마가복음',LUK:'누가복음',JHN:'요한복음',ACT:'사도행전',ROM:'로마서','1CO':'고린도전서','2CO':'고린도후서',GAL:'갈라디아서',EPH:'에베소서',PHP:'빌립보서',COL:'골로새서','1TH':'데살로니가전서','2TH':'데살로니가후서','1TI':'디모데전서','2TI':'디모데후서',TIT:'디도서',PHM:'빌레뮬서',HEB:'히브리서',JAS:'야고보서','1PE':'베드로전서','2PE':'베드로후서','1JN':'요한일서','2JN':'요한이서','3JN':'요한삼서',JUD:'유다서',REV:'요한계시록'};

var _pin='', _pinOk=false, _data=null, _search='', _editIdx=null, _memoText='', _origMemo='', _anyDirty=false;

/* 가상 키보드 기기(터치 전용) 여부 — pointer:coarse & hover:none 조합으로 판별 */
function _jeIsTouchDevice(){
  return window.matchMedia('(pointer:coarse) and (hover:none)').matches;
}
var _jeBibleData=[]; /* JSON 편집기 전용 역본 데이터 */
var _jeBibleName=''; /* 역본 파일명 */

/* ── JSON 편집기 전용 역본 BOOK_NUM (bookAbbr 배열) ── */
var _JE_BOOK_NUM=['','창','출','레','민','신','수','삿','룻','삼상','삼하','왕상','왕하','대상','대하','스','느','에','욥','시','잠','전','아','사','렘','애','겔','단','호','욜','암','옵','욘','미','나','합','습','학','슥','말','마','막','눅','요','행','롬','고전','고후','갈','엡','빌','골','살전','살후','딤전','딤후','딛','몬','히','약','벧전','벧후','요1','요2','요3','유','계'];
var _JE_ABBR_ALIAS={'요일':'요1','요이':'요2','요삼':'요3'};

/* 역본 드롭존 업데이트 */
function _jeBibleDropUpdate(){
  var dz=_$('je-bible-drop'), dt=_$('je-bible-drop-txt'); if(!dz||!dt) return;
  if(_jeBibleData.length){
    dz.classList.add('loaded');
    dt.style.justifyContent='center';
    dt.innerHTML='<strong style="color:#2d6a4f">✅ '+_e(_jeBibleName)+'</strong> &nbsp;<span style="color:#9a9288;font-size:0.72rem;">'+_jeBibleData.length.toLocaleString()+'절 로드됨</span>';
    /* 에디터가 열려있으면 절 패널 즉시 갱신 */
    if(_editIdx!==null) _jeRefreshVersePanel();
  } else {
    dz.classList.remove('loaded');
    dt.innerHTML='📂 성경역본 불러오기 &nbsp;·&nbsp; TXT · AAB · BDB 드래그드롭 또는 클릭';
  }
}

/* 절 패널만 갱신 (역본 로드 후 호출) */
function _jeRefreshVersePanel(){
  var vp=_$('je-verse-panel'), vt=_$('je-verse-text'), vs=_$('je-verse-src');
  if(!vp||!vt||!vs) return;
  var item=(_data[_jeTab]||[])[_editIdx]; if(!item) return;
  var bd=_jeGetBibleData(), srcName=_jeGetBibleName();
  if(!bd.length) return;

  var bookName=(_jeTab==='bookmarks')?_bn(item.bookCode):_jeBookName(item.book);
  var abbr, ch, vsStart, vsEnd;
  if(_jeTab==='bookmarks'){
    var codeToAbbr={GEN:'창',EXO:'출',LEV:'레',NUM:'민',DEU:'신',JOS:'수',JDG:'삿',RUT:'룻',
      '1SA':'삼상','2SA':'삼하','1KI':'왕상','2KI':'왕하','1CH':'대상','2CH':'대하',
      EZR:'스',NEH:'느',EST:'에',JOB:'욥',PSA:'시',PRO:'잠',ECC:'전',SNG:'아',
      ISA:'사',JER:'렘',LAM:'애',EZK:'겔',DAN:'단',HOS:'호',JOL:'욜',AMO:'암',
      OBA:'옵',JNH:'욘',JON:'욘',MIC:'미',NAM:'나',HAB:'합',ZEP:'습',HAG:'학',ZEC:'슥',MAL:'말',
      MAT:'마',MRK:'막',LUK:'눅',JHN:'요',ACT:'행',ROM:'롬',
      '1CO':'고전','2CO':'고후',GAL:'갈',EPH:'엡',PHP:'빌',COL:'골',
      '1TH':'살전','2TH':'살후','1TI':'딤전','2TI':'딤후',TIT:'딛',PHM:'몬',
      HEB:'히',JAS:'약','1PE':'벧전','2PE':'벧후','1JN':'요1','2JN':'요2','3JN':'요3',JUD:'유',REV:'계'};
    abbr=codeToAbbr[item.bookCode]||item.bookCode;
    ch=parseInt(item.chapter)||1; vsStart=parseInt(item.verse)||1;
    vsEnd=item.verseEnd?parseInt(item.verseEnd):vsStart;
  } else if(_jeTab==='sermons'){
    abbr=_JE_BOOK_NUM[item.book]||'';
    ch=parseInt(item.chapter)||1; vsStart=parseInt(item.verseStart)||1;
    vsEnd=item.verseEnd?parseInt(item.verseEnd):vsStart;
  } else {
    abbr=_JE_BOOK_NUM[item.book]||'';
    ch=parseInt(item.chapter)||1; vsStart=parseInt(item.verse)||1; vsEnd=vsStart;
  }
  var rows=bd.filter(function(d){return d.book===abbr&&d.ch===ch&&d.vs>=vsStart&&d.vs<=vsEnd;});
  rows.sort(function(a,b){return a.vs-b.vs;});
  if(rows.length){
    _jeVerseRows=rows; _jeRenderVt();
    vs.textContent=bookName+' '+ch+':'+vsStart+(vsEnd>vsStart?'-'+vsEnd:'')+(srcName?' · '+srcName:'');
    vp.classList.add('je-vp-show');
  }
}

/* TXT 파싱 */
function _jeLoadTxt(buffer, fileName){
  var enc='UTF-8';
  try{ new TextDecoder('UTF-8',{fatal:true}).decode(buffer); }
  catch(e){ enc='EUC-KR'; }
  var text=new TextDecoder(enc).decode(buffer);
  var lines=text.split(/\r?\n/);
  var data=lines.filter(function(l){return l.includes('|');}).map(function(l){
    var pi=l.indexOf('|'); var k=l.slice(0,pi); var t=l.slice(pi+1);
    var m=k.match(/^(.+?)\s+(\d+):(\d+)/);
    if(!m) return null;
    var raw=m[1].trim(); var book=_JE_ABBR_ALIAS[raw]||raw;
    return {title:k.trim().replace(/\s+/g,' '),text:t?t.trim():'',book:book,ch:parseInt(m[2]),vs:parseInt(m[3])};
  }).filter(function(d){return d&&d.book;});
  _jeBibleData=data; _jeBibleName=fileName;
  _jeBibleDropUpdate();
  _toast('역본 로드 완료: '+fileName);
}

/* BDB/AAB(SQLite) 파싱 */
function _jeLoadSqlite(buffer, sliceOffset, fileName){
  var sqliteBuf=sliceOffset>0?buffer.slice(sliceOffset):buffer;
  initSqlJs({locateFile:function(f){return 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/'+f;}})
  .then(function(SQL){
    try{
      var db=new SQL.Database(new Uint8Array(sqliteBuf));
      var res=db.exec('SELECT book,chapter,verse,btext FROM Bible ORDER BY book,chapter,verse');
      db.close();
      if(!res.length||!res[0].values.length){_toast('성경 데이터 없음');return;}
      _jeBibleData=res[0].values.map(function(r){
        var bookAbbr=_JE_BOOK_NUM[r[0]]||''; if(!bookAbbr) return null;
        return {title:bookAbbr+' '+r[1]+':'+r[2],text:r[3]?r[3].trim():'',book:bookAbbr,ch:parseInt(r[1]),vs:parseInt(r[2])};
      }).filter(function(d){return d&&d.book;});
      _jeBibleName=fileName;
      _jeBibleDropUpdate();
      _toast('역본 로드 완료: '+fileName);
    }catch(err){_toast('파일 오류: '+err.message);}
  });
}

/* 파일 처리 분기 */
function _jeHandleBibleFile(file){
  if(!file) return;
  var name=file.name; var lower=name.toLowerCase();
  var reader=new FileReader();
  if(lower.endsWith('.zip')){
    /* ZIP: JSZip 사용 */
    reader.onload=function(e){
      JSZip.loadAsync(e.target.result).then(function(zip){
        var entries=[]; zip.forEach(function(path,entry){
          if(entry.dir) return;
          var n=path.split('/').pop();
          if(!n||n.startsWith('.')) return;
          if(['.txt','.bdb','.aab'].some(function(x){return n.toLowerCase().endsWith(x);})) entries.push({name:n,entry:entry});
        });
        if(!entries.length){_toast('ZIP 안에 지원 파일 없음');return;}
        /* 첫 번째 파일 사용 */
        entries[0].entry.async('arraybuffer').then(function(buf){
          var inner=new File([buf],entries[0].name);
          _jeHandleBibleFile(inner);
        });
      }).catch(function(){_toast('ZIP 읽기 실패');});
    };
    reader.readAsArrayBuffer(file); return;
  }
  if(lower.endsWith('.bdb')){
    reader.onload=function(e){_jeLoadSqlite(e.target.result,0,name);}; reader.readAsArrayBuffer(file); return;
  }
  if(lower.endsWith('.aab')){
    reader.onload=function(e){_jeLoadSqlite(e.target.result,8,name);}; reader.readAsArrayBuffer(file); return;
  }
  /* TXT */
  reader.onload=function(e){_jeLoadTxt(e.target.result,name);}; reader.readAsArrayBuffer(file);
}

/* 드롭존 초기화 (DOMContentLoaded 후 호출) */
function _jeInitBibleDrop(){
  var dz=_$('je-bible-drop'); if(!dz) return;
  /* 이미 loaded면 클릭 무시 (파일 재선택 허용하려면 loaded 조건 제거) */
  dz.addEventListener('dragover',function(e){e.preventDefault();if(!dz.classList.contains('loaded'))dz.classList.add('drag');});
  dz.addEventListener('dragleave',function(){dz.classList.remove('drag');});
  dz.addEventListener('drop',function(e){

    var f=e.dataTransfer.files[0]; if(f) _jeHandleBibleFile(f);

  var inp=_$('je-bible-inp'); if(!inp) return;
  inp.onchange=function(){if(this.files[0]){_jeHandleBibleFile(this.files[0]);this.value='';}};

  GEN:1,EXO:2,LEV:3,NUM:4,DEU:5,JOS:6,JDG:7,RUT:8,
  '1SA':9,'2SA':10,'1KI':11,'2KI':12,'1CH':13,'2CH':14,
  EZR:15,NEH:16,EST:17,JOB:18,PSA:19,PRO:20,ECC:21,SNG:22,
  ISA:23,JER:24,LAM:25,EZK:26,DAN:27,HOS:28,JOL:29,AMO:30,
  OBA:31,JON:32,MIC:33,NAM:34,HAB:35,ZEP:36,HAG:37,ZEC:38,MAL:39,
  MAT:40,MRK:41,LUK:42,JHN:43,ACT:44,ROM:45,
  '1CO':46,'2CO':47,GAL:48,EPH:49,PHP:50,COL:51,
  '1TH':52,'2TH':53,'1TI':54,'2TI':55,TIT:56,PHM:57,

/* 한글 책명 → 순번 (sermons/highlights 탭 — book 필드가 한글) */
function _jeBookNum(bookVal){
  if(!bookVal) return 0;
  // 숫자면 그냥 사용
  var n = parseInt(bookVal);
  if(!isNaN(n) && n>0) return n;
  // 영문 코드면 _JE_CODE_NUM
  if(_JE_CODE_NUM[bookVal]) return _JE_CODE_NUM[bookVal];
  // 한글 약칭: _JE_BOOK_NUM 배열에서 검색
  for(var k=1;k<_JE_BOOK_NUM.length;k++){
    if(_JE_BOOK_NUM[k]===bookVal) return k;
  }
  // 한글 전체 이름: _JE_BOOK_NAMES 배열
  if(typeof _JE_BOOK_NAMES !== 'undefined'){
    for(var k=1;k<_JE_BOOK_NAMES.length;k++){
      if(_JE_BOOK_NAMES[k]===bookVal) return k;
    }
  }
  return 0;
}

function _jeSortItems(arr, tab){
  // 원본 인덱스 보존
  var a = arr.map(function(item, i){ item._origIdx = i; return item; });
  tab = tab || _jeTab;

  if(_jeSort === 'bible'){
    a.sort(function(x, y){
      // bookmarks: bookCode(영문) / sermons,highlights: book(한글or숫자)
      var bx, by;
      if(tab === 'bookmarks'){
        bx = _JE_CODE_NUM[x.bookCode] || 0;
        by = _JE_CODE_NUM[y.bookCode] || 0;
      } else {
        bx = _jeBookNum(x.book);
        by = _jeBookNum(y.book);
      }
      if(bx !== by) return bx - by;

      var cx = parseInt(x.chapter)||0, cy = parseInt(y.chapter)||0;
      if(cx !== cy) return cx - cy;

      // 시작 절: bookmarks=verse, sermons=verseStart, highlights=verse
      var vx = parseInt(x.verse || x.verseStart)||0;
      var vy = parseInt(y.verse || y.verseStart)||0;
      if(vx !== vy) return vx - vy;

      // 끝 절(verseEnd) 포함
      var ex = parseInt(x.verseEnd)||vx;
      var ey = parseInt(y.verseEnd)||vy;
      return ex - ey;
    });

  } else if(_jeSort === 'recent'){
    a.sort(function(x,y){
      var dx = x.createdAt||'', dy = y.createdAt||'';
      return dy > dx ? 1 : dy < dx ? -1 : 0;
    });

  } else if(_jeSort === 'oldest'){
    a.sort(function(x,y){
      var dx = x.createdAt||'', dy = y.createdAt||'';
      return dx > dy ? 1 : dx < dy ? -1 : 0;
    });

  } else if(_jeSort === 'modified'){
    a.sort(function(x,y){
      var mx = x.updatedAt||x.modifiedAt||x.createdAt||'';
      var my = y.updatedAt||y.modifiedAt||y.createdAt||'';
      return my > mx ? 1 : my < mx ? -1 : 0;
    });
  }
  return a;
}

function jeSetSort(val){
  _jeSort = val;
  document.querySelectorAll('.je-sort-btn').forEach(function(b){
    b.className = 'je-sort-btn' + (b.getAttribute('data-sort') === val ? ' on' : '');
  });
  _renderList();
}

    // 책이름 직접 비교

function _renderBookFilter(){
  var bar = _$('je-book-filter-bar');
  if(!bar) return;

  var items = _data[_jeTab]||[];
  var bookCount = {}, bookOrder = {};
  for(var i=0;i<items.length;i++){
    var n = _jeItemBookNum(items[i], _jeTab);
    var name = (_jeTab==='bookmarks')
      ? (_BN[items[i].bookCode]||items[i].bookCode)
      : _jeBookName(items[i].book);
    if(!bookCount[name]){ bookCount[name]=0; bookOrder[name]=n; }
    bookCount[name]++;
  }
  var otTotal=0, ntTotal=0;
  for(var k in bookCount){
    var n=bookOrder[k];
    if(n>=1&&n<=39) otTotal+=bookCount[k];
    else if(n>=40) ntTotal+=bookCount[k];
  }
  var bookNames = Object.keys(bookCount).sort(function(a,b){ return bookOrder[a]-bookOrder[b]; });

/* 저장된 태그 → 화면 HTML 변환 */
function _tagsToHtml(text){
  /* memo는 이미 HTML 형식 (<b>, &lt; 등 포함) — \n→<br>만 처리 */
  if(!text) return '';
  return text
    .replace(/&lt;J&gt;([\s\S]*?)&lt;\/J&gt;/g,'<span class="je-j">$1</span>')
    .replace(/<J>([\s\S]*?)<\/J>/g,'<span class="je-j">$1</span>')
    .replace(/\n/g,'<br>');
}
/* 화면 HTML → 저장 태그 변환 */
function _htmlToTags(html){
  if(!html) return '';
  var s=html;
  /* 줄바꿈 변환 */
  s=s.replace(/<br\s*\/?>/gi,'\n')
     .replace(/<\/div>/gi,'\n').replace(/<div[^>]*>/gi,'')
     .replace(/<\/p>/gi,'\n').replace(/<p[^>]*>/gi,'');
  /* 보존할 서식 태그 → 임시 플레이스홀더 (HTML 태그 제거 전에) */
  var P='\x01';
  s=s.replace(/<strong>([\s\S]*?)<\/strong>/gi,P+'b'+P+'$1'+P+'/b'+P)
     .replace(/<b>([\s\S]*?)<\/b>/gi,P+'b'+P+'$1'+P+'/b'+P)
     .replace(/<em>([\s\S]*?)<\/em>/gi,P+'i'+P+'$1'+P+'/i'+P)
     .replace(/<i>([\s\S]*?)<\/i>/gi,P+'i'+P+'$1'+P+'/i'+P)
     .replace(/<u>([\s\S]*?)<\/u>/gi,P+'u'+P+'$1'+P+'/u'+P)
     .replace(/<strike>([\s\S]*?)<\/strike>/gi,P+'s'+P+'$1'+P+'/s'+P)
     .replace(/<s>([\s\S]*?)<\/s>/gi,P+'s'+P+'$1'+P+'/s'+P)
     .replace(/<span class="je-j">([\s\S]*?)<\/span>/gi,P+'J'+P+'$1'+P+'/J'+P)
     .replace(/<font color="([^"]*)">([\s\S]*?)<\/font>/gi,P+'font color="$1"'+P+'$2'+P+'/font'+P)
     .replace(/<span style="color:([^"]*)">([\s\S]*?)<\/span>/gi,P+'font color="$1"'+P+'$2'+P+'/font'+P);
  /* 나머지 HTML 태그 전부 제거 */
  s=s.replace(/<[^>]*>/g,'');
  /* 플레이스홀더 → 실제 태그 */
  s=s.replace(new RegExp(P+'([^'+P+']+)'+P,'g'),'<$1>');
  return s;
}

/* ── 모바일 뒤로가기 처리 ── */
(function(){
  /* 현재 화면 단계 반환
     0 = 모두 닫힘(앱 메인)
     1 = 핀 화면
     2 = 목록 화면
     3 = 편집 화면                                              */
  function _jeStage(){
    var pinOv=_$('je-pin-ov'), edOv=_$('je-ed-ov'), editOv=_$('je-edit-ov');
    if(pinOv&&pinOv.classList.contains('je-show')) return 1;
    if(edOv&&edOv.classList.contains('je-show')){
      if(editOv&&editOv.style.display!=='none') return 3;
      return 2;
    }
    return 0;
  }

  /* history 스택에 상태 쌓기 */
  function _jePushState(stage){
    history.pushState({jeStage:stage},'','');
  }

  /* 기존 함수들을 래핑하여 pushState 삽입 */
  var _origShowPin=window.jeShowPin;
  window.jeShowPin=function(){
    _origShowPin&&_origShowPin.apply(this,arguments);
    _jePushState(_jeStage());
  };

  var _origOpenEdit=window.jeOpenEdit;
  window.jeOpenEdit=function(){
    _origOpenEdit&&_origOpenEdit.apply(this,arguments);
    _jePushState(3);
  };

  /* ── 나가기 안내 토스트 ── */
  var _jeExitToast=null, _jeExitTimer=null;
  var _jeExitReady=false;

  function _jeShowExitToast(){
    if(_jeExitToast) return;
    _jeExitReady=true;
    _jeExitToast=document.createElement('div');
    _jeExitToast.id='je-exit-toast';
    _jeExitToast.textContent='한 번 더 뒤로 가면 앱을 종료합니다';
    _jeExitToast.style.cssText=[
      'position:fixed','bottom:36px','left:50%',
      'transform:translateX(-50%)',
      'background:rgba(30,30,30,0.88)',
      'color:#fff',
      'padding:11px 24px',
      'border-radius:100px',
      'font-size:0.84rem',
      'font-weight:600',
      'white-space:nowrap',
      'z-index:99999',
      'box-shadow:0 4px 18px rgba(0,0,0,0.22)',
      'pointer-events:none',
      'font-family:inherit',
      'animation:je-toast 2.2s ease forwards'
    ].join(';');
    document.body.appendChild(_jeExitToast);
    _jeExitTimer=setTimeout(function(){
      _jeExitReady=false;
      if(_jeExitToast&&_jeExitToast.parentNode) _jeExitToast.parentNode.removeChild(_jeExitToast);
      _jeExitToast=null;
      history.pushState({jeStage:0},'','');
    },2200);
  }

  function _jeHideExitToast(){
    _jeExitReady=false;
    if(_jeExitTimer) clearTimeout(_jeExitTimer);
    _jeExitTimer=null;
    if(_jeExitToast&&_jeExitToast.parentNode) _jeExitToast.parentNode.removeChild(_jeExitToast);
    _jeExitToast=null;
  }

  /* 초기 state */
  history.replaceState({jeStage:0},'','');
  history.pushState({jeStage:0},'','');

  window.addEventListener('popstate',function(e){
    var stage=_jeStage();

    /* 편집 화면 → 목록 */
    if(stage===3){
      _jeHideExitToast();
      jeBackToList();
      history.pushState({jeStage:2},'','');
      return;
    }

    /* 목록/핀 → 닫기 */
    if(stage===2||stage===1){
      _jeHideExitToast();
      jeHideAll();
      history.pushState({jeStage:0},'','');
      return;
    }

    /* 앱 메인 — 두 번째 뒤로가기면 종료, 첫 번째면 토스트 */
    if(_jeExitReady){
      _jeHideExitToast();
      history.go(-1);
      return;
    }

    _jeShowExitToast();
    history.pushState({jeStage:0},'','');
  });
})();

  function onUp(){
    document.querySelectorAll('#je-resize-bar,#je-resize-bar-list').forEach(function(b){b.classList.remove('dragging');});
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);

    document.removeEventListener('touchend',onUp);
    document.body.style.cursor='';
    document.body.style.userSelect='';

  function attachBar(bar){
    if(!bar)return;

    });
  }
  attachBar(document.getElementById('je-resize-bar'));
  attachBar(document.getElementById('je-resize-bar-list'));
})();

<script>
/* ── 파일 체크섬 (CRC32) ── */
(function(){
  /* CRC32 테이블 생성 */
  var _crcTable=(function(){
    var t=new Uint32Array(256);
    for(var i=0;i<256;i++){
      var c=i;
      for(var j=0;j<8;j++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
      t[i]=c;
    }
    return t;
  })();

  function _crc32(str){
    var crc=0xFFFFFFFF;
    for(var i=0;i<str.length;i++){
      var code=str.charCodeAt(i);
      /* UTF-16 → UTF-8 바이트 처리 */
      if(code<0x80){
        crc=_crcTable[(crc^code)&0xFF]^(crc>>>8);
      } else if(code<0x800){
        crc=_crcTable[(crc^(0xC0|(code>>6)))&0xFF]^(crc>>>8);
        crc=_crcTable[(crc^(0x80|(code&0x3F)))&0xFF]^(crc>>>8);
      } else {
        crc=_crcTable[(crc^(0xE0|(code>>12)))&0xFF]^(crc>>>8);
        crc=_crcTable[(crc^(0x80|((code>>6)&0x3F)))&0xFF]^(crc>>>8);
        crc=_crcTable[(crc^(0x80|(code&0x3F)))&0xFF]^(crc>>>8);
      }
    }
    return ((crc^0xFFFFFFFF)>>>0).toString(16).toUpperCase().padStart(8,'0');
  }

  document.addEventListener('DOMContentLoaded',function(){
    var el=document.getElementById('je-checksum-val');
    if(!el) return;
    try{
      var src=document.documentElement.outerHTML;
      var hash=_crc32(src);
      /* 4자씩 끊어서 가독성 향상 */
      el.textContent=hash.slice(0,4)+' '+hash.slice(4);
    } catch(e){
      el.textContent='ERR';
    }
  });
})();
</script>
